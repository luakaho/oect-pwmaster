services:
  oect-pwmaster:
    # 默认使用 GitHub Actions 构建好的多架构镜像（arm64 / amd64）
    image: ghcr.io/luakaho/oect-pwmaster:latest
    # 想本地自己构建就注释上面一行、取消下面两行
    # build: .
    container_name: oect-pwmaster
    restart: unless-stopped
    privileged: true
    environment:
      - FAN_DATA=/data
      - FAN_RT=/data/rt
      - PORT=8090
      - TZ=Asia/Shanghai
    ports:
      - "8090:8090"
    volumes:
      - /dev:/dev
      - /sys:/sys
      - ./data:/data
      - /dev/shm/oect-pwmaster:/data/rt
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/api/status',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
